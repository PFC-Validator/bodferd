# statusgen CI — the two-half single-writer shape (medici-finance/assay
# docs/adopting-assay.md, section: add-statusgen-ci). The PR half runs --lint
# only; the push-to-main half regenerates STATUS.md and commits it. STATUS.md is
# generated by this workflow on main and has a SINGLE writer: never commit
# STATUS.md on a branch.
#
# statusgen comes from ONE place — the sha256-pinned release binary named in
# .assay-versions (channel E), installed and hash-verified below. Vendoring the
# source is retired: a vendored copy is an unpinned fork that rots silently. Fill
# .assay-versions with a real tag + per-platform digest before the first run; the
# install step refuses rather than guesses on a placeholder/absent pin line.
#
# TRUST ROSTER — the NON-secret half, from repository (or organization) Actions
# VARIABLES, never secrets. Under Actions statusgen reads the roster from the
# environment, so without the env block below every roster-backed check (the
# Evidence-actor check on verified/done rows — which identity committed each
# brief's Evidence lines — and the trust gates) reports could-not-check on every
# run while the job stays green: a silent gap, not a pass. Set the five variables
# under Settings > Secrets and variables > Actions > Variables. They carry logins,
# numeric ids and role bindings only (ASSAY_TRUSTED_BOT_SLUGS must bind
# verifier=<slug>:<bot-user-id> for the Evidence-actor check to run); a token or
# key never belongs in any of them. Each job below reports whether the roster was
# present, so an unset roster is LOUD in the job log. See
# docs/adopting-assay.md, section: configure-roster.
name: statusgen
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
env:
  ASSAY_BLESS_LOGIN: ${{ vars.ASSAY_BLESS_LOGIN }}
  ASSAY_TRUSTED_LOGINS: ${{ vars.ASSAY_TRUSTED_LOGINS }}
  ASSAY_TRUSTED_BOT_SLUGS: ${{ vars.ASSAY_TRUSTED_BOT_SLUGS }}
  ASSAY_ALLOWED_REPOS: ${{ vars.ASSAY_ALLOWED_REPOS }}
  ASSAY_HUMAN_LOGIN_MAP: ${{ vars.ASSAY_HUMAN_LOGIN_MAP }}
jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned statusgen (channel E — sha256-verified release binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plat="$(uname -s | tr A-Z a-z)-$(uname -m | sed 's/^x86_64$/amd64/; s/^aarch64$/arm64/')"
          line="$(grep "^statusgen-$plat " .assay-versions || true)"
          if [ -z "$line" ]; then
            echo "::error::no .assay-versions pin for platform $plat — refusing rather than guessing"
            exit 1
          fi
          tag="$(printf '%s' "$line" | awk '{print $2}')"
          sha="$(printf '%s' "$line" | awk '{print $3}')"
          curl --fail --location --proto "=https" --tlsv1.2 --output /tmp/statusgen "https://github.com/medici-finance/assay/releases/download/$tag/statusgen-$plat"
          echo "${sha}  /tmp/statusgen" | shasum -a 256 -c -
          sudo install -m 0755 /tmp/statusgen /usr/local/bin/statusgen
      # A freshly-init'd tree ships an example stream, so docs/streams/ is never
      # empty on day one and --lint is green WITHOUT --allow-empty-root. If you
      # delete the example before authoring your own stream, add --allow-empty-root
      # to the line below for that transitional window ONLY — do not leave it on, or
      # the empty-root PROBLEM can never fire for a genuine regression.
      # LOUD, not silent: an unset roster is reported here by name, because
      # statusgen itself only echoes configured=false and role-bindings=(none bound).
      - name: Report trust-roster presence
        run: |
          if [ -z "${ASSAY_TRUSTED_BOT_SLUGS:-}" ]; then
            echo "::notice::ASSAY_TRUSTED_BOT_SLUGS is not set — no trust roster for this run. Every roster-backed statusgen check (the Evidence-actor check on verified/done rows) reports could-not-check, which is NOT a pass. Set the repository Actions VARIABLES ASSAY_BLESS_LOGIN, ASSAY_TRUSTED_LOGINS, ASSAY_TRUSTED_BOT_SLUGS (with its verifier= binding), ASSAY_ALLOWED_REPOS and ASSAY_HUMAN_LOGIN_MAP — the NON-secret roster, never a token or key."
          else
            echo "trust roster present: ASSAY_TRUSTED_BOT_SLUGS is set (statusgen echoes the effective role-bindings= below)"
          fi
      - name: statusgen --lint
        run: statusgen --lint
  regen:
    # STATUS.md is generated on main only, never on a branch (single writer).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned statusgen (channel E — sha256-verified release binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plat="$(uname -s | tr A-Z a-z)-$(uname -m | sed 's/^x86_64$/amd64/; s/^aarch64$/arm64/')"
          line="$(grep "^statusgen-$plat " .assay-versions || true)"
          if [ -z "$line" ]; then
            echo "::error::no .assay-versions pin for platform $plat — refusing rather than guessing"
            exit 1
          fi
          tag="$(printf '%s' "$line" | awk '{print $2}')"
          sha="$(printf '%s' "$line" | awk '{print $3}')"
          curl --fail --location --proto "=https" --tlsv1.2 --output /tmp/statusgen "https://github.com/medici-finance/assay/releases/download/$tag/statusgen-$plat"
          echo "${sha}  /tmp/statusgen" | shasum -a 256 -c -
          sudo install -m 0755 /tmp/statusgen /usr/local/bin/statusgen
      # LOUD, not silent: an unset roster is reported here by name, because
      # statusgen itself only echoes configured=false and role-bindings=(none bound).
      - name: Report trust-roster presence
        run: |
          if [ -z "${ASSAY_TRUSTED_BOT_SLUGS:-}" ]; then
            echo "::notice::ASSAY_TRUSTED_BOT_SLUGS is not set — no trust roster for this run. Every roster-backed statusgen check (the Evidence-actor check on verified/done rows) reports could-not-check, which is NOT a pass. Set the repository Actions VARIABLES ASSAY_BLESS_LOGIN, ASSAY_TRUSTED_LOGINS, ASSAY_TRUSTED_BOT_SLUGS (with its verifier= binding), ASSAY_ALLOWED_REPOS and ASSAY_HUMAN_LOGIN_MAP — the NON-secret roster, never a token or key."
          else
            echo "trust roster present: ASSAY_TRUSTED_BOT_SLUGS is set (statusgen echoes the effective role-bindings= below)"
          fi
      - name: Regenerate STATUS.md
        run: statusgen --root .
      # Regenerate every board: generated stream README's Briefs table (its
      # authoring columns), the same single-writer discipline as STATUS.md. A
      # README without board: generated is left hand-maintained (NOTICE only).
      - name: Regenerate stream README tables
        run: statusgen regen --readmes --root .
      # ONLINE DRIFT COMPARATOR (opt-in). When this repo grants the regen job
      # `pull-requests: read` and `issues: read` and passes `--repo <owner>/<name>`,
      # `statusgen regen --readmes --repo …` folds the PR witnesses through the
      # lifecycle derivation and prints a NOTICE for every board cell that
      # disagrees with the derived state. It is READ-ONLY (the reconcile verb
      # touches only read endpoints) and never fires offline — a could-not-check
      # is not a drift. Uncomment and add the permissions to enable it:
      #   run: statusgen regen --readmes --root . --repo ${{ github.repository }}
      - name: Commit generated board surfaces if they changed
        run: |
          set -euo pipefail
          git config user.name  'statusgen'
          git config user.email 'statusgen@users.noreply.github.com'
          # Path-scoped add: STATUS.md plus the generated stream README tables.
          git add STATUS.md docs/streams
          # BOOTSTRAP-SAFE GUARD: guard on `git status --porcelain` for the paths,
          # NOT `git diff --quiet`. git diff sees only TRACKED files, so on a repo
          # with no STATUS.md yet the diff guard mis-fires ("nothing to commit")
          # and the first board is NEVER created; porcelain reports the new/staged file.
          if [ -n "$(git status --porcelain -- STATUS.md docs/streams)" ]; then
            git commit -m 'chore(status): regenerate [skip-status-regen]'
            git push
          fi
